scalar DateTime

enum Currency {
  USD
  UAH
}

type Guarantee {
  id: ID!
  productId: ID!
  orderId: ID!
  start: DateTime
  end: DateTime
}

type Price {
  id: ID!
  value: Float!
  symbol: Currency!
  isDefault: Boolean!
}

type Money {
  value: Float!
  symbol: Currency!
}

type Product {
  id: ID!
  serialNumber: String!
  isNew: Boolean!
  photo: String
  title: String!
  type: ProductType!
  specification: String
  date: DateTime!
  guarantee: Guarantee
  prices: [Price!]!
  defaultPrice: Price
}

type Order {
  id: ID!
  title: String!
  description: String
  address: String
  latitude: Float
  longitude: Float
  date: DateTime!
  products: [Product!]!
  guarantees: [Guarantee!]!
  productsCount: Int!
  totals: [Money!]!
}

input ProductFilter {
  orderId: ID
  isNew: Boolean
  search: String
}

input GuaranteeInput {
  start: DateTime
  end: DateTime
}

input PriceInput {
  value: Float!
  symbol: Currency!
  isDefault: Boolean!
}

input CreateOrderInput {
  title: String!
  description: String
  address: String
  latitude: Float
  longitude: Float
  productIds: [ID!]
  date: DateTime
}

input UpdateOrderInput {
  title: String
  description: String
  address: String
  latitude: Float
  longitude: Float
  date: DateTime
}

input CreateProductInput {
  serialNumber: String!
  isNew: Boolean! = true
  photo: String
  title: String!
  type: ProductType!
  specification: String
  prices: [PriceInput!]!
  date: DateTime
}

input UpdateProductInput {
  serialNumber: String
  isNew: Boolean
  photo: String
  title: String
  specification: String
  prices: [PriceInput!]
  date: DateTime
}

type Query {
  orders(limit: Int = 50, offset: Int = 0): [Order!]!
  order(id: ID!): Order
  products(filter: ProductFilter, limit: Int = 50, offset: Int = 0): [Product!]!
  product(id: ID!): Product
}

type Mutation {
  createOrder(input: CreateOrderInput!): Order!
  updateOrder(id: ID!, input: UpdateOrderInput!): Order!
  deleteOrder(id: ID!): Boolean!
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  deleteProduct(id: ID!): Boolean!
}
